Software System Engineer at **Intel**. For the last four years I've worked on kernel and build-system infrastructure for the **first AI accelerators shipped inside x86 CPUs** (14th-gen mobile and later).

I like understanding code all the way down and squeezing performance out of it.

## focus
- low-level systems and performance

**severity:** high

- an unauthenticated photo API let anyone scrape every user's images

/* ---------- tiny renderers ---------- */
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inl = s => esc(s)
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, u) => `<a href="${u}"${/^https?:/.test(u) ? ' target="_blank" rel="noopener"' : ""}>${t}</a>`)
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/!!([^!]+)!!/g, '<span class="red">$1</span>');

function md(src) {
  const L = src.trim().split("\n"), out = [];
  for (let i = 0; i < L.length;) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith("```")) {
      i++; while (i < L.length && !L[i].startsWith("```")) out.push(`<div class="ln code blk">${esc(L[i++]) || " "}</div>`); i++; continue;
    }
    if (l.startsWith("## ")) { out.push(`<div class="ln h2"><span class="mk">## </span>${inl(l.slice(3))}</div>`); i++; continue; }
    if (l.startsWith("# ")) { out.push(`<div class="ln h1"><span class="mk"># </span>${inl(l.slice(2))}</div>`); i++; continue; }
    if (l.startsWith("- ")) { out.push(`<div class="ln li"><span class="mk">-</span><span>${inl(l.slice(2))}</span></div>`); i++; continue; }
    const buf = [];
    while (i < L.length && L[i].trim() && !/^(# |## |- |```)/.test(L[i])) buf.push(L[i++]);
    out.push(`<p class="ln">${inl(buf.join(" "))}</p>`);
  }
  return `<div class="pv">${out.join("")}</div>`;
}

function toml(src) {
  return `<div class="pv">` + src.trim().split("\n").map(l => {
    let h;
    if (!l.trim()) h = " ";
    else if (/^\s*#/.test(l)) h = `<span class="c">${esc(l)}</span>`;
    else if (/^\[.*\]$/.test(l.trim())) h = `<span class="y">${esc(l)}</span>`;
    else {
      const m = l.match(/^(\s*[\w.-]+)(\s*=\s*)(.*)$/);
      h = m ? `<span class="cy">${esc(m[1])}</span>${m[2]}` + esc(m[3]).replace(/("[^"]*")|(\b\d+\b)/g, (x, s, n) => s ? `<span class="g">${s}</span>` : `<span class="m">${n}</span>`) : esc(l);
    }
    return `<div class="ln code">${h}</div>`;
  }).join("") + `</div>`;
}

const cols = document.querySelector(".cols");
const GUTTERS = {

  g2: {v: "--w2", col: mid,  min: 180, max: () => cols.clientWidth * 0.5},

function setWidth(id, px, save = true) {
  const g = GUTTERS[id];
  // never squeeze the preview below 360px
  const room = cols.clientWidth - 360 - (id === "g1" ? mid.offsetWidth : left.offsetWidth);
  px = Math.round(Math.max(g.min, Math.min(px, g.max(), room)));
  cols.style.setProperty(g.v, px + "px");
  $(id).setAttribute("aria-valuenow", px);
  if (save) try { localStorage.setItem("cv" + g.v, px); } catch (_) {}
}
function resetWidth(id) {
  cols.style.removeProperty(GUTTERS[id].v);
  try { localStorage.removeItem("cv" + GUTTERS[id].v); } catch (_) {}
}
for (const [id, g] of Object.entries(GUTTERS)) {
  const el = $(id);
  el.setAttribute("aria-valuemin", g.min);
  try { const w = +localStorage.getItem("cv" + g.v); if (w) cols.style.setProperty(g.v, w + "px"); } catch (_) {}
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    el.classList.add("drag"); document.body.classList.add("resizing");
    const x0 = e.clientX, w0 = g.col.getBoundingClientRect().width;
    const move = ev => setWidth(id, w0 + ev.clientX - x0);
    const up = () => {
      el.classList.remove("drag"); document.body.classList.remove("resizing");
      el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
    };
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
  });
  el.addEventListener("dblclick", () => resetWidth(id));
  el.addEventListener("keydown", e => {
    const step = e.shiftKey ? 64 : 16, w = g.col.getBoundingClientRect().width;
    if (e.key === "ArrowLeft") { e.preventDefault(); setWidth(id, w - step); }
    else if (e.key === "ArrowRight") { e.preventDefault(); setWidth(id, w + step); }
    else if (e.key === "Home" || e.key === "Enter") { e.preventDefault(); resetWidth(id); }
  });
}

});

  const el = $("boot");
  let seen = false;
  try { seen = sessionStorage.getItem("booted") === "1"; sessionStorage.setItem("booted", "1"); } catch (_) {}
  if (seen || matchMedia("(prefers-reduced-motion: reduce)").matches) { start(); return; }

  el.innerHTML = `<span class="skip">click or press any key to skip</span>`;
  let i = 0, done = false; const timers = [];
  const finish = () => {
    if (done) return; done = true;
    timers.forEach(clearTimeout); el.hidden = true;
    removeEventListener("keydown", skip, true);
    start();
  };
  const skip = e => { e.preventDefault(); e.stopPropagation(); finish(); };
  addEventListener("keydown", skip, true);
  el.addEventListener("click", finish);
  const step = () => {
    if (i >= BOOT.length) { timers.push(setTimeout(finish, 700)); return; }
    el.innerHTML += BOOT[i] + "\n";
    timers.push(setTimeout(step, i < 4 ? 90 : i < 8 ? 190 : 260)); i++;
  };
  step();
}
boot();
